name: MetaGuard Schema Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "migrations/*.sql"
      - "models/**/*.sql"
      - "schema/**/*.sql"

permissions:
  contents: read
  pull-requests: write

jobs:
  metaguard:
    name: Run MetaGuard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MetaGuard
        shell: bash
        env:
          OPENMETADATA_HOST: ${{ secrets.OPENMETADATA_HOST || 'https://sandbox.open-metadata.org' }}
          OPENMETADATA_TOKEN: ${{ secrets.OPENMETADATA_TOKEN || 'eyJraWQiOiJHYjM4OWEtOWY3Ni1nZGpzLWE5MmotMDI0MmJrOTQzNTYiLCJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..tHe8G_HsSEOtTptGO6q_2-vIZjSsDFQ1E_9QEf8L3lh8LKD788msp9-xNPDYhT99hKin8mkRIIaiBzYJG7NCInHg_7-_VYEfLYrjiGzESUybrL7XKzoaA2V_VfQZJS2Nj_J2nA54XzDYetIqaSxsd3DGwKAoxPccrsEvFNtU6O9xFZLh9p-O6FeRuwBP7TuhefJ1y5XBMwBfokpun9uD8gJ8gxjMK7TMYpfCDkpp3KSN25AI4MFRv6uqPKlP2BkY5Ds4Zin9Vau4LYsQ-WboIUz_pfO0TZlHeQn2LeAC8QKdycVJwGg4jbk-nBNMlb_-__FBHIXqrpR6h9nCfdwIFQ' }}
          OPENMETADATA_MCP_URL: ${{ secrets.OPENMETADATA_MCP_URL || 'https://sandbox.open-metadata.org/mcp' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LLM_SUMMARY: "false"
          LINEAGE_MAX_DEPTH: "3"
        run: |
          set -euo pipefail
          python main.py \
            --mode sandbox \
            --transport mcp \
            --om-asset "acme_nexus_analytics.ANALYTICS.MARTS.fact_orders" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --output github || \
          python main.py \
            --mode mock \
            --fixture F1 \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --output github | tee metaguard.md

      - name: Upload MetaGuard report
        uses: actions/upload-artifact@v4
        with:
          name: metaguard-report
          path: metaguard.md
